name: Release VoiceRoom

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Garantir release única
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const releaseParams = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag
            };
            try {
              await github.rest.repos.getReleaseByTag(releaseParams);
              core.info(`A release ${tag} já existe; os artefatos serão anexados a ela.`);
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: tag,
                body: 'Artefatos gerados automaticamente pelo workflow de release.',
                draft: false,
                prerelease: false
              });
              core.info(`Release ${tag} criada antes do upload dos artefatos.`);
            }

      - name: Gerar e publicar instalador
        run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
